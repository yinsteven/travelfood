<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 洗資料實作</title>
</head>

<body>



    <script src="js/jquery-4.0.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>



    <script>
        $(function () {

            $.ajax({
                type: "GET",
                url: "js/json/HotelList.json",
                dataType: "json",
                success: showdata,
                error: function () {
                    Swal.fire({
                        title: "連線錯誤!",
                        text: "無法連接後端API",
                        icon: "error",
                    });
                }
            })
        })

        function showdata(data) {
            console.log(data.Hotels)

            //1.資料轉換map()，取出所需要欄位
            //2.資料清洗null undefined 多餘空白
            const cleanHotelData = normalize(data.Hotels)
            console.log("清洗後的資料:", cleanHotelData)


            //3.過濾 臺中市房價低於3800旅館
            //延伸 找出最低房價介於2000~4000的旅館
            //延伸 排除沒有電話，沒有房價的旅館
            const filterHotelData =cleanHotelData.filter(function (item) {
                return item.lowestprice < 3800 && item.city === "臺中市"
            })
            console.log("臺中市低於3800旅館資料:", filterHotelData)


            //4.分頁 每頁20筆 可以指定頁碼
            const PageSize = 20
            const Page = 4
            const PageData = pagination(filterHotelData, PageSize, Page)
            console.log("第" + Page + "頁的結果:", PageData)
        }


        //資料清洗副程式
        function normalize(data) {
            return data.map(function (item,index) {
                return {
                    id:index+1,
                    name: (item.HotelName ?? "未提供").trim(),
                    city: (item.PostalAddress.City ?? "未提供").trim(),
                    tel: (item.Telephones ?? "未提供"),
                    lowestprice: (item.LowestPrice ?? "未提供"),
                    description: (item.Description ?? "未提供").trim(),
                }
            });



        }

        //分頁副程式
        function pagination(data, PageSize, Page) {
            const start = (Page - 1) * PageSize
            const end = start + PageSize

            return data.slice(start, end)
        }





    </script>
</body>

</html>
