<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH8 表單-CRUD練習</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="myallcss.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @media screen and (max-width: 768px) {

            /* =========================
   夜晚霓虹燈效果
   ========================= */

            /* 整個網頁背景 */
            body {
                background-color: #050510;
                color: white;
            }

            /* 標題霓虹燈 */
            .display-2 {
                color: #00ffff;

                text-shadow:
                    0 0 5px #00ffff,
                    0 0 10px #00ffff,
                    0 0 20px #00ffff,
                    0 0 40px #00ffff;
            }

            /* Table 外框 */
            .table-rwd {
                background-color: #080818;

                border: 2px solid #00ffff !important;

                box-shadow:
                    0 0 5px #00ffff,
                    0 0 15px #00ffff,
                    0 0 30px #00ffff,
                    inset 0 0 15px rgba(0, 255, 255, 0.15);
            }

            /* 表格格線 */
            .table-rwd th,
            .table-rwd td {
                border-color: #00ffff !important;
            }

            /* 表頭 */
            .table-rwd thead {
                background-color: #12002b !important;

                color: #00ffff;

                text-shadow:
                    0 0 5px #00ffff,
                    0 0 10px #00ffff;
            }

            /* 表格內容 */
            .table-rwd tbody {
                background-color: #080818;
            }

            /* 表格文字 */
            .table-rwd td {
                color: #ffffff;
            }

            /* 滑鼠移到某一列 */
            .table-rwd tbody tr:hover {
                background-color: #16002b;

                box-shadow:
                    0 0 10px #ff00ff,
                    0 0 20px #ff00ff,
                    inset 0 0 15px rgba(255, 0, 255, 0.2);
            }

            /* 圖片霓虹邊框 */
            .table-rwd img {
                border: 2px solid #ff00ff;

                box-shadow:
                    0 0 5px #ff00ff,
                    0 0 10px #ff00ff,
                    0 0 20px #ff00ff;
            }

            /* 手機版 data-th 的文字 */
            @media screen and (max-width: 768px) {

                .table-rwd tbody tr td::before {
                    color: #00ffff;

                    text-shadow:
                        0 0 5px #00ffff,
                        0 0 10px #00ffff;
                }

            }

            .table-rwd thead {
                display: none;
            }

            .table-rwd tbody tr {
                display: block;
            }

            .table-rwd tbody tr td {
                display: block;
                overflow: hidden;
            }

            .table-rwd img {
                width: 150px;
                height: 100px;
                object-fit: cover;
            }

            .table-rwd tbody tr td::before {
                content: attr(data-th)":";
                font-size: 20px;
                font-weight: 900;
                display: block;
                float: left;
                width: 30%;
                text-align: right;
                padding-right: 15px;
                color: aquamarine;
            }

            .table-rwd tbody tr td span {
                display: block;
                float: left;
                width: 70%;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">CRUD練習</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="#">首頁</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="20261110 ch8 forms CRUD-C.html">產品建檔</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="20261110 ch8 forms CRUD-R.html">產品列表</a>
                    </li>

            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="card mt-4">
                    <div class="card-header text-info fw-bold h1 text-center">產品列表</div>
                    <div class="card-body">
                        <table class="table table-bordered table-rwd">
                            <thead class="table-dark">
                                <tr>
                                    <th width="10%">產品名稱</th>
                                    <th width="20%">產品價格</th>
                                    <th width="10%">產品數量</th>
                                    <th width="10%">產品分類</th>
                                    <th width="10%">產品備註</th>
                                    <th width="10%">#</th>

                                </tr>
                            </thead>
                            <tbody id="mytbody">
                                <tr>
                                    <td data-th="產品名稱">cccccc</td>
                                    <td data-th="產品價格">cccccc</td>
                                    <td data-th="產品數量">cccccc</td>
                                    <td data-th="產品分類">cccccc</td>
                                    <td data-th="產品備註">cccccc</td>
                                    <td data-th="功能">
                                        <button class="btn btn-warning" data-bs-toggle="modal"
                                            data-bs-target="#updateModal">更新</button>
                                        <button class="btn btn-danger">刪除</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- 頁碼 -->
                        <nav aria-label="Page navigation example">
                            <ul class="pagination justify-content-center" id="pageList">
                                <li class="page-item">
                                    <a class="page-link" href="#" aria-label="Previous">
                                        <span aria-hidden="true">&laquo;</span>
                                    </a>
                                </li>
                                <li class="page-item"><a class="page-link" href="#">1</a></li>
                                <li class="page-item"><a class="page-link" href="#">2</a></li>
                                <li class="page-item"><a class="page-link" href="#">3</a></li>
                                <li class="page-item">
                                    <a class="page-link" href="#" aria-label="Next">
                                        <span aria-hidden="true">&raquo;</span>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!-- updataModal -->
    <div class="modal fade" id="updateModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true"
        data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header text-bg-warning">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">產品更新</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3 form-floating">
                        <input type="text" class="form-control form-control-lg" placeholder="" id="pname">
                        <label for="pname" class="form-label">產品名稱(字數2-6字數)</label>
                        <div class="valid-feedback">符合規定</div>
                        <div class="invalid-feedback">不符合規定</div>
                    </div>

                    <div class="mb-3">
                        <label for="price" class="form-label">價格(1-100)</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text">NT$</span>
                            <input type="number" class="form-control" id="price" min="1" max="100" value="50">
                            <div class="valid-feedback">價格符合規定</div>
                            <div class="invalid-feedback">價格不符合規定</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="num" class="form-label">數量: <span class="h2 text-danger fw-bold"
                                id="num-text">50</span>
                            個</label>
                        <input type="range" class="form-range" min="1" max="100" step="1" value="50" id="num">
                        <div class="d-flex justify-content-between small text-muted">
                            <span class="fw-bold">1</span>
                            <span class="fw-bold">100</span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">產品分類</label>
                        <select name="" id="category" class="form-select form-select-lg">
                            <option value="" class="text-center" disabled>---產品分類---</option>
                            <option value="零食" disabled-selected>零食</option>
                            <option value="乳製品" disabled>乳製品</option>
                            <option value="飲料" disabled>飲料</option>
                        </select>
                        <div class="valid-feedback">已選擇分類</div>
                    </div>

                    <div class="mb-3">
                        <label for="remark" class="form-label">備註</label>
                        <textarea disabled id="remark" class="form-control">避免陽光直射</textarea>

                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="updateModal-btn-update">確認更新</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>

        const pageSize = 5
        let page = 1
        let productData = []   //把第一次透過 AJAX 從後端 API 抓回來的完整產品陣列暫存在記憶體裡,這樣當你之後切換頁碼時，不需要再重新發一次 $.ajax 請求就能直接切出對應頁面的資料

        let flag_price = true
        let uid = ""

        $(function () {
            //取得資料 GET API
            $.ajax({
                type: "GET",
                url: "http://localhost:3000/product",
                dataType: "json",
                success: showdata,
                error: function () {
                    Swal.fire({
                        title: "讀取失敗!",
                        text: "無法連接後端API",
                        icon: "error",
                    });
                }
            })


            //藏頁碼data-page ->監聽->重新顯示，用productData
            //監聽點擊頁碼
            $("#pageList").on("click", ".page-link", function () {
                console.log($(this).data("page"))
                page = Number($(this).data("page"))

                //重新顯示畫面
                showdata(productData)
            })

            //監聽更新按鈕
            $("#mytbody").on("click", ".btn-update", function () {
                console.log($(this).data("id"))
                const id = $(this).data("id")
                uid = $(this).data("id")


                ///傳遞至後端API 取得資料
                $.ajax({
                    type: "GET",
                    url: "http://localhost:3000/product/" + id,
                    dataType: "json",
                    success: showUpdateData,
                    error: function () {
                        Swal.fire({
                            title: "讀取失敗!",
                            text: "無法連接後端API",
                            icon: "error",
                        });
                    }
                })
            })

            //監聽產品數量range
            $("#num").on("input", function () {
                $("#num-text").text($(this).val())
            })

            //監聽 價格price
            $("#price").on("change", function () {
                const price = Number($(this).val())
                if (price >= 1 && price <= 100) {
                    $(this).removeClass("is-invalid")
                    $(this).addClass("is-valid")
                    flag_price = true
                } else {
                    $(this).removeClass("is-valid")
                    $(this).addClass("is-invalid")
                    flag_price = false
                }
            })

            //監聽確認更新按鈕  updateModal-btn-update
            $("#updateModal-btn-update").on("click", function () {
                if (!flag_price) {     //    !是反向 否定意思  
                    Swal.fire({
                        title: "更新失敗!",
                        text: "價格欄位錯誤!",
                        icon: "error",
                    });
                    return
                }
                //取得表單資料
                const price = Number($("#price").val())
                const num = Number($("#num").val())

                //轉換成json格式傳遞至後端，執行更新步驟
                const jsonData = {
                    price: price,
                    num: num
                }

                console.log(JSON.stringify(jsonData))   //轉換成json

                //傳遞至後端，執行更新步驟
                $.ajax({
                    type: "PATCH",
                    url: "http://localhost:3000/product/" + uid,
                    dataType: "json",
                    data: JSON.stringify(jsonData),
                    contentType: "application/json",
                    success: function (data) {
                        console.log("更新成功", data)

                        //關閉modal
                        bootstrap.Modal.getInstance(document.getElementById("updateModal")).hide()

                        Swal.fire({
                            title: "更新成功!",
                            text: "產品資料已更新!",
                            icon: "success",
                        });


                        //重新取得產品列表
                        $.ajax({
                            type: "GET",
                            url: "http://localhost:3000/product",
                            dataType: "json",
                            success: showdata,
                        })


                    },
                    error: function () {
                        Swal.fire({
                            title: "更新失敗!",
                            text: "無法更新產品資料!",
                            icon: "error",
                        });
                    }
                })
            })

            //監聽刪除按鈕
            $("#mytbody").on("click", ".btn-delete", function () {
                console.log($(this).data("id"))
                const did = $(this).data("id")  //for delete

                //詢問確認是否刪除
                Swal.fire({
                    title: "確認要刪除?????",
                    showDenyButton: true,
                    showCancelButton: false,
                    confirmButtonText: "確認",
                    denyButtonText: `取消`,
                    icon: "question"
                }).then((result) => {
                    /* Read more about isConfirmed, isDenied below */
                    if (result.isConfirmed) {
                        //傳送did至後端API執行刪除
                        $.ajax({
                            type: "DELETE",
                            url: "http://localhost:3000/product/" + did,
                            dataType: "json",
                            success: function (data) {
                                console.log(data)
                                Swal.fire({
                                    title: "刪除成功!",
                                    text: "產品資料已刪除!",
                                    icon: "success",
                                });

                                //重新取得產品列表
                                $.ajax({
                                    type: "GET",
                                    url: "http://localhost:3000/product",
                                    dataType: "json",
                                    success: function(data){
                                        
                                        //避免刪除後頁碼錯誤
                                        const totalPage = Math.ceil(data.length/pageSize)
                                        if(page > totalPage){
                                            page =Math.max(1,totalPage)   //避免全部刪完 變第0頁
                                        }
                                        
                                        showdata(data)
                                    },
                                })


                            },
                            error: function () {
                                Swal.fire({
                                    title: "刪除失敗!",
                                    text: "無法刪除產品資料!",
                                    icon: "error",
                                });
                            }
                        })
                    }
                    else if (result.isDenied) Swal.fire("放棄刪除", "", "info");
                });

            })

        })

        function showdata(data) {
            console.log(data)
            productData = data  //把第一次透過 AJAX 從後端 API 抓回來的完整產品陣列暫存在記憶體裡,這樣當你之後切換頁碼時，不需要再重新發一次 $.ajax 請求就能直接切出對應頁面的資料

            //分頁
            const pageData = pagination(data, pageSize, page)




            $("#mytbody").empty() // 讓第一行消失
            pageData.forEach(function (item) {
                let strHTML = `<tr>
                                    <td data-th="產品名稱">${item.name}</td>
                                    <td data-th="產品價格">${item.price}</td>
                                    <td data-th="產品數量">${item.num}</td>
                                    <td data-th="產品分類">${item.category}</td>
                                    <td data-th="產品備註">${item.remark}</td>
                                    <td data-th="功能">
                                        <button class="btn btn-warning btn-update" data-bs-toggle="modal"data-bs-target="#updateModal" data-id="${item.id}">更新</button>
                                        <button class="btn btn-danger btn-delete" data-id="${item.id}">刪除</button>
                                    </td>
                                </tr>`
                $("#mytbody").append(strHTML);
            })

            //產生頁碼
            const totalPage = Math.ceil(data.length / pageSize)
            $("#pageList").empty();

            //上一頁
            if (page > 1) {
                $("#pageList").append(`<li class="page-item"><a class="page-link" href="#" data-page="${page - 1}" >上一頁</a></li>`);
            }


            //頁碼
            for (let i = 1; i <= totalPage; i++) {
                // if (i === page) {
                //     active = "active"
                // } else {
                //     active = ""
                // }

                // 三元運算子
                let active = (i === page) ? "active" : "";

                let strHTML = ` <li class="page-item ${active}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`
                $("#pageList").append(strHTML);
            }

            //下一頁
            if (page < totalPage) {
                $("#pageList").append(`<li class="page-item"><a class="page-link" href="#" data-page="${page + 1}" >下一頁</a></li>`);
            }
        }



        //更新抓到資料後顯示在updaModal
        function showUpdateData(data) {
            console.log(data)

            //將資料擺入updateModal
            $("#pname").val(data.name)
            $("#price").val(data.price)
            $("#num").val(data.num)
            $("#num-text").text(data.num)
            $("#category").val(data.category)
            $("#remark").val(data.remark)
        }



        function pagination(data, pageSize, page) {
            const start = (page - 1) * pageSize
            const end = start + pageSize

            return data.slice(start, end)
        }


    </script>
</body>

</html>
