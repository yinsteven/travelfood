<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ch7 Flex時間軸(Timeline)</title>
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="myallcss.css">
</head>
<style>
    .box {
        height: 180px;
    }
    /* roller-top */
.roller-t{
    position: relative;
    overflow: hidden;
}
.roller-t .rollerbox-t{
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: rgba(1, 86, 199, 0.3);
    transform: translateY(-100%);
    transition: transform 2s;
    display: flex;
    justify-content: center;
    align-items: center;
}
.roller-t:hover .rollerbox-t{
    transform: translateX(0);
}
 /* roller-bottom */
.roller-b{
    position: relative;
    overflow: hidden;
}
.roller-b .rollerbox-b{
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: rgba(1, 86, 199, 0.3);
    transform: translateY(100%);
    transition: transform 2s;
    display: flex;
    justify-content: center;
    align-items: center;
}
.roller-b:hover .rollerbox-b{
    transform: translateX(0);
}
 /* roller-left */
.roller-l{
    position: relative;
    overflow: hidden;
}
.roller-l .rollerbox-l{
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: rgba(1, 86, 199, 0.3);
    transform: translateX(-100%);
    transition: transform 2s;
    display: flex;
    justify-content: center;
    align-items: center;
}
.roller-l:hover .rollerbox-l{
    transform: translateX(0);
}
 /* roller-right */
.roller-r{
    position: relative;
    overflow: hidden;
}
.roller-r .rollerbox-r{
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: rgba(1, 86, 199, 0.3);
    transform: translateX(100%);
    transition: transform 2s;
    display: flex;
    justify-content: center;
    align-items: center;
}
.roller-r:hover .rollerbox-r{
    transform: translateX(0);
}

</style>



<body>

    <div class="container">
        <div class="row">
            <div class="col-6 mt-3">
                <div class="box bg-info roller-l">
                    <div class="rollerbox-l">哈囉你好嗎ㄏㄏㄏ</div>
                </div>
            </div>
        </div>
    </div>





    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
